name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: actions/cache@v4
        with:
          path: .local-signing/debug.keystore
          key: frontier-beta-explicit-signing-v2
      - name: Ensure the cached beta signing key exists
        run: |
          mkdir -p .local-signing
          if [ ! -f .local-signing/debug.keystore ]; then
            keytool -genkeypair -noprompt -keystore .local-signing/debug.keystore -storetype JKS -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Prepare Gradle distribution with bounded network retries
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew --version; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Test and build debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: strategy-game-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
  device-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Prepare Gradle distribution with bounded network retries
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew --version; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tools/device_checks.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/device-screenshots/
